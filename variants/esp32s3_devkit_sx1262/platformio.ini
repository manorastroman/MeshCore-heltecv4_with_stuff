[ESP32S3_devkit_SX1262]
extends = esp32_base
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
  ${esp32_base.build_flags}
  -I variants/esp32s3_devkit_sx1262
  -D ESP32S3_DEVKIT_SX1262
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D P_LORA_NSS=10
  -D P_LORA_SCLK=12
  -D P_LORA_MOSI=11
  -D P_LORA_MISO=13
  -D P_LORA_RESET=14
  -D P_LORA_BUSY=9
  -D P_LORA_DIO_1=8
  -D SX126X_TXEN=15
  -D SX126X_RXEN=16
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D PIN_BOARD_SDA=17
  -D PIN_BOARD_SCL=18
  -D PIN_USER_BTN=0
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/esp32s3_devkit_sx1262>
lib_deps =
  ${esp32_base.lib_deps}

[env:ESP32S3_devkit_SX1262_room_server]
extends = ESP32S3_devkit_SX1262
build_src_filter = ${ESP32S3_devkit_SX1262.build_src_filter}
  +<helpers/ui/U8g2Display.h>
  +<../examples/simple_room_server>
build_flags =
  ${ESP32S3_devkit_SX1262.build_flags}
  -D DISPLAY_CLASS=U8g2Display
  -D U8G2_CONTROLLER=U8G2_SH1107_SEEED_128X128_F_HW_I2C
  -D AUTO_OFF_MILLIS=0
  -D OLED_WIDTH=128
  -D OLED_HEIGHT=128
  -D LORA_FREQ=910.252
  -D LORA_BW=62.5
  -D LORA_SF=7
  -D LORA_CR=5
  -D LORA_TX_POWER=22
  -D ADVERT_NAME='"S3 Room Server"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
lib_deps =
  ${ESP32S3_devkit_SX1262.lib_deps}
  ${esp32_ota.lib_deps}
  olikraus/U8g2 @ ^2.35.19
